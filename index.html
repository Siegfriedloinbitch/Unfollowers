<style>
/* VOICE: calm, private, a little playful in Wrapped
   IDEA: a phone app in a dark room, one violet light
   PICTURE: the working lists and the unfollow queue themselves
   COLOUR and TYPE: near-black #0d0d10, cards #18181d, violet #8b7cf6, pink alerts; Inter
   LAYOUT: one 520px column, stacked cards, sticky bottom action bar */
:root{color-scheme:dark;--bg:#0d0d10;--card:#18181d;--card2:#202027;--line:#26262d;--ink:#ededf0;--mu:#8b8b95;--ac:#8b7cf6;--ac2:#a99bff;--acbg:#241f3d;--pink:#ff8fa8;--pinkln:#5a2d3a;--ok:#7ee0a3;--okln:#2c5a3f;--warn:#f5b860}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(110px + env(safe-area-inset-bottom));min-height:100vh}
h1{font-size:22px;font-weight:600;margin:0;letter-spacing:-.01em}
h2{font-size:17px;font-weight:600;margin:0}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:40px}
.top .sp{flex:1}
.ib{width:40px;height:40px;border-radius:12px;border:0;background:var(--card);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.ib svg{width:20px;height:20px}
.chip{border:1px solid #34343b;background:transparent;color:#c5c5cc;border-radius:999px;padding:7px 12px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;min-height:34px}
.chip.on{background:var(--acbg);border-color:#4b4380;color:#d4ccff}
.lang{display:inline-flex;border:1px solid #34343b;border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--mu);font:inherit;font-size:13px;padding:7px 11px;cursor:pointer}
.lang button.on{color:#fff;background:#26262d}
.card{background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.mu{color:var(--mu);font-size:13px}
.sm{font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid2 .card{margin:0}
.stat{cursor:pointer;border:0;text-align:left;color:inherit;font:inherit;width:100%}
.stat b{display:block;font-size:24px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.row{display:flex;align-items:center;gap:12px;min-height:48px}
.navrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);color:inherit;font:inherit;text-align:left;border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;min-height:54px}
.navrow .ic{color:var(--ac2);display:flex}
.navrow .ic svg{width:20px;height:20px}
.navrow .cnt{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums}
.chev{color:var(--mu);display:flex;margin-left:auto}
.chev svg{width:16px;height:16px}
.sec{color:var(--mu);font-size:13px;margin:18px 2px 8px}
.drop{display:flex;align-items:center;gap:12px;border:1.5px dashed #3a3a42;border-radius:14px;padding:16px;margin-bottom:10px;cursor:pointer;position:relative}
.drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.drop .ic svg{width:26px;height:26px;color:var(--ac2)}
.drop.big{flex-direction:column;text-align:center;padding:30px 16px}
.alert{border:1px solid var(--pinkln)}
.alert .h{color:var(--pink);font-size:13px}
.okc{border:1px solid var(--okln)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:12px 16px;font:inherit;font-weight:500;border:1px solid #3a3a42;background:transparent;color:var(--ink);cursor:pointer;min-height:46px;text-decoration:none;text-align:center}
.btn svg{width:18px;height:18px}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#0d0d10}
.btn.ghost{border-color:transparent;color:var(--mu)}
.btn.danger{border-color:var(--pinkln);color:var(--pink)}
.btn.w{width:100%}
.btn[aria-disabled=true]{opacity:.45}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--mu);flex:none}
.search input{flex:1;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;padding:11px 0;outline:none}
.search select{background:transparent;border:0;color:var(--mu);font:inherit;font-size:13px;outline:none;max-width:44%}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.list{background:var(--card);border-radius:14px;padding:2px 12px}
.it{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);min-height:56px}
.it:last-child{border:0}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none;text-transform:uppercase}
.it .nm{flex:1;min-width:0}
.it .nm a,.it .nm span.u{color:var(--ink);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cb{width:24px;height:24px;border-radius:7px;border:1.5px solid #4a4a52;flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;padding:0}
.cb.on{background:var(--ac);border-color:var(--ac);color:#0d0d10}
.cb svg{width:15px;height:15px}
.star{border:0;background:transparent;color:#55555e;cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none}
.star.on{color:#f5c95c}
.star svg{width:20px;height:20px}
.bar{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(13,13,16,.94);border-top:1px solid var(--line);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);z-index:5}
.bar .in{max-width:520px;margin:0 auto;display:flex;gap:10px;align-items:center}
.empty{text-align:center;padding:30px 16px;color:var(--mu)}
.prog{height:6px;background:#2a2a30;border-radius:3px;overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:3px}
.big{font-size:30px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.qcard{text-align:center;padding:22px 16px}
.qcard .av{width:72px;height:72px;font-size:28px;margin:0 auto}
.qcard .u{font-size:18px;font-weight:600;margin-top:10px;word-break:break-all}
.btns{display:flex;gap:8px;margin-top:10px}
.btns>*{flex:1}
.hbars .hb{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.hbars .hb span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .hb .tr{flex:1;height:8px;background:#26262d;border-radius:4px;overflow:hidden}
.hbars .hb .tr i{display:block;height:100%;background:var(--ac);border-radius:4px}
.hbars .hb b{font-weight:500;color:var(--mu);font-size:13px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.months{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.months div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.months i{display:block;width:100%;background:#3a3460;border-radius:3px;min-height:2px}
.months i.mx{background:var(--ac)}
.months span{font-size:10px;color:var(--mu)}
.heat{display:grid;grid-template-columns:28px repeat(24,minmax(0,1fr));gap:2px;margin-top:8px;font-size:10px;color:var(--mu)}
.heat i{display:block;aspect-ratio:1;border-radius:2px;background:var(--ac)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--card2);border-radius:999px;padding:5px 10px;font-size:13px}
.step{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.step:last-child{border:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--acbg);color:var(--ac2);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.step b{font-weight:600}
details summary{cursor:pointer;color:var(--ac2);font-size:14px;padding:6px 0;list-style:none}
details summary::-webkit-details-marker{display:none}
.swipe{position:relative;height:360px;margin:6px 0 14px;touch-action:pan-y}
.sc{position:absolute;inset:0;background:var(--card);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;user-select:none;touch-action:none;cursor:grab}
.sc.back{transform:scale(.95) translateY(12px);opacity:.6}
.sc .av{width:96px;height:96px;font-size:38px}
.sc .u{font-size:20px;font-weight:600;word-break:break-all}
.sc .lbl{position:absolute;top:18px;padding:5px 12px;border-radius:8px;font-weight:600;font-size:14px;opacity:0}
.sc .lbl.l{left:18px;color:var(--pink);border:2px solid var(--pink)}
.sc .lbl.r{right:18px;color:#f5c95c;border:2px solid #f5c95c}
.rbtn{width:64px;height:64px;border-radius:50%;border:1px solid #3a3a42;background:var(--card);color:var(--ink);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rbtn svg{width:26px;height:26px}
.rbtn.x{color:var(--pink);border-color:var(--pinkln)}
.rbtn.k{color:#f5c95c;border-color:#5a4a22}
.rbtn.sm2{width:48px;height:48px;color:var(--mu)}
.rbtn.sm2 svg{width:20px;height:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;z-index:20;padding:16px}
.modal .card{max-width:488px;width:100%;padding:18px;margin:0 0 env(safe-area-inset-bottom)}
.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#2b2b33;color:var(--ink);padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;text-align:center}
.spin{width:26px;height:26px;border:3px solid #3a3a42;border-top-color:var(--ac);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
input[type=range]{width:100%;accent-color:var(--ac)}
a{color:var(--ac2)}
:focus-visible{outline:2px solid var(--ac2);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* plan / queue */
function todayCount() { return ST.plan.log[dayKey()] || 0; }

}
let tick = null;
function vQueue() {
  const P = ST.plan, now = Date.now();

  const cur = P.items[0];

  if (state === 'paused') h += `<div class="card alert" style="text-align:center;padding:22px 16px"><div style="color:var(--pink);display:inline-flex;width:32px;height:32px">${ic('pause')}</div><h2 style="margin-top:6px">${t('paused')}</h2><p class="mu">${t('pausedSub')} ${fmtDT(P.pausedUntil)}.</p><button class="btn" data-act="resume">${ic('play')} ${t('resume')}</button></div>`;
  else if (state === 'daily') h += `<div class="card okc" style="text-align:center;padding:22px 16px"><div style="color:var(--ok);display:inline-flex;width:32px;height:32px">${ic('ok')}</div><h2 style="margin-top:6px">${t('dailyDone')}</h2><p class="mu">${t('dailyDoneSub')}</p></div>`;
  else if (state === 'break') h += `<div class="card" style="text-align:center;padding:22px 16px"><div style="color:var(--ac2);display:inline-flex;width:32px;height:32px">${ic('clock')}</div><h2 style="margin-top:6px">${t('breakT')}</h2><p class="mu">${t('breakSub')} ${fmtT(P.breakUntil)}.</p><div class="big" id="cd"></div></div>`;

    else h += `<p class="mu sm" style="margin:10px 0 0">${hint}</p><a class="btn pri w" style="margin-top:12px" href="${ig(cur.u)}" target="_blank" rel="noopener" data-act="opened">${ic('ig')} ${t('open')}</a><div class="btns"><button class="btn" data-act="qdone">${ic('check')} ${t('done')}</button><button class="btn" data-act="qgone" style="color:var(--mu);font-size:13px">${t('gone')}</button></div><div class="btns"><button class="btn ghost" data-act="qskip">${t('skip')}</button><button class="btn ghost" data-act="qkeep">${ic('star')} ${t('keep')}</button></div>`;
    h += `</div>`;

function startTick() {
  clearInterval(tick); tick = null;
  if (V.name !== 'queue') { document.title = 'Unfollowers'; return; }
  const P = ST.plan;
  const upd = () => {
    const now = Date.now(); const tgt = P.breakUntil > now ? P.breakUntil : P.nextAt;
    const el = document.getElementById('cd');
    if (tgt <= now) { clearInterval(tick); tick = null; document.title = 'Unfollowers'; if (el) { try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch (e) { } beep(); render(); } return; }
    const s = Math.ceil((tgt - now) / 1000); const txt = s >= 3600 ? Math.floor(s / 3600) + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0') : Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    if (el) el.textContent = txt; document.title = txt + ' · Unfollowers';
  };

}
let actx = null;
function beep() { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); const o = actx.createOscillator(), g = actx.createGain(); o.frequency.value = 880; g.gain.setValueAtTime(.08, actx.currentTime); g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + .4); o.connect(g).connect(actx.destination); o.start(); o.stop(actx.currentTime + .4); } catch (e) { } }
function qAdvance(counted) {
  const P = ST.plan; const it = P.items.shift(); const now = Date.now();
  if (counted) {

  startTick();
}
function toast(msg) { const d = document.createElement('div'); d.className = 'toast'; d.textContent = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2600); }
function ask(msg, yes, onYes) {
  const ly = document.getElementById('layer');
  ly.innerHTML = `<div class="modal" data-act="mclose"><div class="card" role="dialog" aria-modal="true"><p style="margin:0 0 14px">${esc(msg)}</p><div class="btns"><button class="btn" data-act="mclose">${t('cancel')}</button><button class="btn pri" data-act="myes">${esc(yes || t('yes'))}</button></div></div></div>`;
  ly.onclick = e => { const a = e.target.closest('[data-act]'); if (!a) return; if (a.dataset.act === 'myes') { ly.innerHTML = ''; onYes(); } else if (a.dataset.act === 'mclose' && (e.target === a)) ly.innerHTML = ''; };
}
function paceSheet() {
  const P = ST.plan; const cur = P.min === 180 ? 'calm' : P.min === 60 ? 'fast' : 'normal';
  const ly = document.getElementById('layer');
  ly.innerHTML = `<div class="modal" data-act="mclose"><div class="card" role="dialog" aria-modal="true"><h2>${t('settings')}</h2><div style="margin-top:14px" class="mu">${t('dailyLimit')}: <b id="dlv" style="color:var(--ink)">${P.daily}</b></div><input type="range" min="20" max="150" step="5" value="${P.daily}" id="dl"><div class="mu" style="margin-top:12px">${t('delay')}</div><div class="chips" style="flex-wrap:wrap;margin-top:6px">${['calm', 'normal', 'fast'].map(k => `<button class="chip ${cur === k ? 'on' : ''}" data-act="pace" data-p="${k}">${t(k)}</button>`).join('')}</div><div class="btns"><button class="btn danger" data-act="clearq">${t('clearQ')}</button><button class="btn pri" data-act="mclose">OK</button></div></div></div>`;
  const dl = ly.querySelector('#dl'); dl.oninput = () => { P.daily = +dl.value; ly.querySelector('#dlv').textContent = P.daily; saveST(); };
  ly.onclick = e => {
    const a = e.target.closest('[data-act]'); if (!a) return;
    if (a.dataset.act === 'pace') { const m = { calm: [180, 360], normal: [120, 240], fast: [60, 120] }[a.dataset.p]; P.min = m[0]; P.max = m[1]; saveST(); ly.querySelectorAll('[data-act=pace]').forEach(b => b.classList.toggle('on', b === a)); }
    else if (a.dataset.act === 'clearq') { ly.innerHTML = ''; ask(t('clearQSure'), t('clearQ'), () => { P.items = []; P.total = 0; P.nextAt = 0; saveST(); derive(); render(); }); }
    else if (a.dataset.act === 'mclose' && e.target === a) { ly.innerHTML = ''; render(); }
  };
}

/* import */
async function importFiles(fl) {
  if (!fl || !fl.length) return;
  busy = [...fl].map(f => f.name).join(', '); render();
  try {
    const all = []; let date = 0;
    for (const f of fl) {
      const r = new zip.ZipReader(new zip.BlobReader(f), { useWebWorkers: false });
      const ents = await r.getEntries();
      for (const e of ents) { if (e.directory) continue; if (e.lastModDate && e.lastModDate.getTime() > date) date = e.lastModDate.getTime(); all.push({ name: e.filename, text: () => e.getData(new zip.TextWriter()) }); }
    }
    const R = await IGParser.parse(all, (d, n) => { busy = d + ' / ' + n; const m = document.getElementById('busy'); if (m) m.textContent = busy; });
    if (!R.has.followers && !R.has.following) throw new Error('NO_DATA');
    if (!date || date > Date.now() + 864e5) date = Date.now();
    const prev = D;
    if (prev && prev.me && R.me && prev.me !== R.me) { SN = []; }
    R.date = date; D = R;
    const fgset = new Set(R.following.map(x => x.u.toLowerCase()).concat(R.pending.map(x => x.u.toLowerCase())));
    for (const k in ST.done) { if (!fgset.has(k) || date > ST.done[k] + 3600e3) delete ST.done[k]; }
    for (const k in ST.gone) { if (!fgset.has(k)) delete ST.gone[k]; }
    const snap = { d: date, fo: R.followers.map(x => x.u.toLowerCase()), fg: R.following.map(x => x.u.toLowerCase()) };
    SN = SN.filter(s => dayKey(new Date(s.d)) !== dayKey(new Date(date))); SN.push(snap); SN.sort((a, b) => b.d - a.d); SN = SN.slice(0, 40);
    await DB.set('data', D); await DB.set('snaps', SN); await saveST();
    busy = null; derive(); V = { name: 'home' }; render(); toast(t('imported') + ' · ' + fmtN(R.followers.length) + ' ' + t('followersN'));
  } catch (e) {
    busy = null; render();
    toast(e.message === 'HTML_FORMAT' ? t('errHtml') : e.message === 'NO_DATA' ? t('errNone') : t('errRead'));
    console.error(e);
  }
}

/* events */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.closest('#layer')) return;
  const act = a.dataset.act;
  if (act === 'nav') { if (a.dataset.to === 'list' && !a.dataset.arg) { go('list', V.name === 'swipe' ? 'notBack' : (V.arg || 'notBack')); return; } go(a.dataset.to, a.dataset.arg); if (a.dataset.arg && a.dataset.arg.startsWith('fmk:')) { LS.tab = +a.dataset.arg.split(':')[1]; render(); } }
  else if (act === 'lang') { lang = a.dataset.l; ST.lang = lang; saveST(); render(); }
  else if (act === 'tab') { LS.tab = +a.dataset.i; LS.sel = new Set(); shown = LIMIT; render(); }
  else if (act === 'filter') { LS.filter = a.dataset.f; LS.sel = new Set(); shown = LIMIT; render(); }
  else if (act === 'more') { shown += LIMIT; render(); }
  else if (act === 'sel') { const k = a.dataset.u.toLowerCase(); LS.sel.has(k) ? LS.sel.delete(k) : LS.sel.add(k); const y = scrollY; render(); scrollTo(0, y); }
  else if (act === 'selall') { const y = scrollY; if (LS.sel.size) LS.sel = new Set(); else LS.sel = new Set(filtered(listDef(V.arg)).map(x => x.u.toLowerCase())); render(); scrollTo(0, y); }
  else if (act === 'keep') { const k = a.dataset.u.toLowerCase(); if (ST.kept[k]) delete ST.kept[k]; else ST.kept[k] = 1; LS.sel.delete(k); saveST(); derive(); const y = scrollY; render(); scrollTo(0, y); }
  else if (act === 'addq') { if (!LS.sel.size) return; const def = listDef(V.arg); const list = def.items.filter(x => LS.sel.has(x.u.toLowerCase())).map(x => ({ u: x.u, kind: a.dataset.kind })); const n = addToPlan(list); saveST(); LS.sel = new Set(); toast(t('addedQ') + ' · ' + n); render(); }
  else if (act === 'swl') swDo('l');
  else if (act === 'swr') swDo('r');
  else if (act === 'swundo') swUndo();
  else if (act === 'qdone') qAdvance(true);
  else if (act === 'qgone') { const it = ST.plan.items[0]; ST.gone[it.u.toLowerCase()] = Date.now(); qAdvance(false); }
  else if (act === 'qskip') { const P = ST.plan; P.items.push(P.items.shift()); saveST(); render(); }
  else if (act === 'qkeep') { const it = ST.plan.items[0]; ST.kept[it.u.toLowerCase()] = 1; ST.plan.total = Math.max(0, ST.plan.total - 1); ST.plan.items.shift(); if (!ST.plan.items.length) ST.plan.total = 0; saveST(); derive(); render(); }
  else if (act === 'pause48') { const P = ST.plan; P.pausedUntil = Date.now() + 48 * 3600e3; P.daily = Math.max(20, Math.round(P.daily * .6 / 5) * 5); P.min = Math.max(P.min, 180); P.max = Math.max(P.max, 360); saveST(); render(); }
  else if (act === 'resume') ask(t('resumeWarn'), t('resume'), () => { ST.plan.pausedUntil = 0; saveST(); render(); });
  else if (act === 'pset') paceSheet();
  else if (act === 'year') { LS.year = a.dataset.y; render(); }
  else if (act === 'delsnap') { const i = +a.dataset.i; ask(t('delSure'), t('del'), async () => { SN.splice(i, 1); await DB.set('snaps', SN); render(); }); }
  else if (act === 'wipe') ask(t('wipeSure'), t('wipe'), async () => { await DB.clear(); D = null; SN = []; ST = defST(); ST.lang = lang; derive(); go('home'); });
});
document.addEventListener('input', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'q') { LS.q = a.value; shown = LIMIT; const pos = a.selectionStart; render(); const n = document.querySelector('[data-act=q]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { } } }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'sort') { LS.sort = a.value; render(); }
  if (a.dataset.act === 'file') importFiles(a.files);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && V.name === 'queue') render(); });

(async () => {
  try {
    const st = await DB.get('st'); if (st) { ST = Object.assign(defST(), st); ST.plan = Object.assign(defST().plan, st.plan || {}); }
    D = (await DB.get('data')) || null; SN = (await DB.get('snaps')) || [];
  } catch (e) { storeOK = false; }
  lang = ST.lang || ((navigator.language || '').toLowerCase().startsWith('el') ? 'el' : 'en');
  derive(); render();
})();
}
</script>
