<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eef4ec" id="tc">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Unfollowers">
<title>Unfollowers</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap&subset=greek" rel="stylesheet">
<style>
/* VOICE: soft, friendly, private
   IDEA: a phone app of rounded cards floating on a tinted sky
   PICTURE: the working screens themselves; glass cards over moving colour
   COLOUR and TYPE: per-skin variables (23 skins), Inter
   LAYOUT: one 520px column, floating bottom nav with a centre + button */
:root{--bg:#f5f7f2;--ink:#1c2a1e;--mu:#76836f;--card:#fff;--cardB:0.5px solid rgba(0,0,0,.05);--sh:0 6px 18px rgba(0,0,0,.06);--soft:#e8e8f0;--icC:#555;--hero:#555;--onH:#fff;--heroB:0 solid transparent;--heroSh:none;--btn:#555;--btnInk:#fff;--navOn:#555;--line:rgba(0,0,0,.06);--pbBg:rgba(255,255,255,.35);--pbFg:#fff;--danger:#e0566e;--ok:#1fae74;--warn:#e3a21a;--field:#fff;
 --t1b:#e3efff;--t1c:#3d8bff;--t2b:#ffe9ec;--t2c:#ff5d7a;--t3b:#fff4dc;--t3c:#e3a21a;--t4b:#e4f7ef;--t4c:#1fae74;color-scheme:light}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink)}
html{background:var(--bg0,#f5f7f2)}
body{font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip;min-height:100vh}
#fx{position:fixed;inset:0;z-index:-1;background:var(--bg);overflow:hidden;pointer-events:none}
#fx i{position:absolute;border-radius:50%;display:block;will-change:transform,opacity}
.fluid #fx i:nth-child(1){animation:f1 18s ease-in-out infinite alternate}
.fluid #fx i:nth-child(2){animation:f2 22s ease-in-out infinite alternate}
.fluid #fx i:nth-child(3){animation:f3 20s ease-in-out infinite alternate}
.fluid #fx i:nth-child(4){animation:f4 16s ease-in-out infinite alternate}
.fluid #fx i:nth-child(5){animation:f2 24s ease-in-out infinite alternate-reverse}
.fluid #fx i:nth-child(6){animation:f1 26s ease-in-out infinite alternate-reverse}
.fluid #fx i.pop{animation:pop 14s ease-in-out infinite,f3 20s ease-in-out infinite alternate}
@keyframes f1{to{transform:translate(-14vw,8vh) scale(1.15)}}
@keyframes f2{to{transform:translate(12vw,-9vh) scale(.9)}}
@keyframes f3{to{transform:translate(10vw,10vh) scale(1.2)}}
@keyframes f4{to{transform:translate(-10vw,-7vh) scale(1.1)}}
@keyframes pop{0%,100%{opacity:0}35%,60%{opacity:.95}}
.still #fx i,.still #fx i.pop{animation:none!important}
.fl #fx::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(5,10,40,.28) 0%,rgba(5,10,40,.08) 45%,rgba(5,10,40,.16) 100%)}
.still #fx i.pop{opacity:.5}
@media (prefers-reduced-motion:reduce){#fx i{animation:none!important}}
#app{max-width:520px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px calc(120px + env(safe-area-inset-bottom))}
.nonav #app{padding-bottom:calc(40px + env(safe-area-inset-bottom))}
.fl #app{text-shadow:0 1px 2px rgba(0,0,0,.12)}
h1{font-size:24px;font-weight:600;margin:0;letter-spacing:-.02em}
h2{font-size:18px;font-weight:600;margin:0;letter-spacing:-.01em}
.mu{color:var(--mu);font-size:13px}
.sm{font-size:12px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px;min-height:44px}
.top .sp{flex:1}
.cir{width:42px;height:42px;border-radius:50%;border:var(--cardB);background:var(--card);box-shadow:var(--sh);color:var(--ink);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;flex:none;position:relative;overflow:hidden;padding:0}
.cir svg{width:20px;height:20px;position:relative}
.c{position:relative;background:var(--card);border:var(--cardB);box-shadow:var(--sh);border-radius:20px;padding:13px 14px;margin-bottom:10px;overflow:hidden}
.c>*{position:relative}
.gl .c,.gl .cir,.gl .nav,.gl .chip,.gl .search{backdrop-filter:blur(5px) saturate(170%);-webkit-backdrop-filter:blur(5px) saturate(170%)}
.gl .c::before,.gl .hero::before{content:"";position:absolute;left:-15%;top:-45%;width:80%;height:110%;background:radial-gradient(ellipse at 35% 45%,rgba(255,255,255,var(--shine,.8)),rgba(255,255,255,calc(var(--shine,.8)*.3)) 40%,rgba(255,255,255,0) 70%);filter:blur(18px);pointer-events:none}
button.c{display:block;width:100%;font:inherit;color:inherit;text-align:left;cursor:pointer}
button.c.navrow,.c.navrow{display:flex}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:10px}
.grid3 .c,.grid2 .c{margin:0}
.ic{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft);color:var(--icC);flex:none}
.ic svg{width:19px;height:19px}
.ic.t1{background:var(--t1b);color:var(--t1c)}.ic.t2{background:var(--t2b);color:var(--t2c)}.ic.t3{background:var(--t3b);color:var(--t3c)}.ic.t4{background:var(--t4b);color:var(--t4c)}
.stat b{display:block;font-size:22px;font-weight:600;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.hero{position:relative;overflow:hidden;border-radius:22px;padding:16px;margin-bottom:12px;background:var(--hero);color:var(--onH);border:var(--heroB);box-shadow:var(--heroSh);display:block;width:100%;text-align:left;font:inherit;cursor:pointer}
.hero>*{position:relative}
.hero .t{font-size:18px;font-weight:600;margin-top:2px}
.hero .s{font-size:13px;opacity:.88}
.hero .go{position:absolute;right:14px;top:14px;width:32px;height:32px;border-radius:50%;background:var(--onH);color:var(--heroGo,var(--icC));display:flex;align-items:center;justify-content:center}
.hero .go svg{width:18px;height:18px}
.pb{height:7px;background:var(--pbBg);border-radius:4px;overflow:hidden;margin-top:10px}
.pb i{display:block;height:100%;background:var(--pbFg);border-radius:4px}
.rw{display:flex;align-items:center;gap:12px}
.navrow{display:flex;align-items:center;gap:12px;min-height:44px}
.navrow .tx{flex:1}
.chev{color:var(--mu);display:flex}
.chev svg{width:16px;height:16px}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:20px 4px 10px}
.sec b{font-size:16px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:12px 16px;font:inherit;font-weight:600;border:0;background:var(--btn);color:var(--btnInk);cursor:pointer;min-height:46px;text-decoration:none;text-align:center}
.btn svg{width:18px;height:18px}
.btn.sec2{background:var(--card);color:var(--ink);border:var(--cardB);font-weight:500}
.btn.ghost{background:transparent;color:var(--mu);font-weight:500}
.btn.danger{background:transparent;color:var(--danger);border:1px solid color-mix(in srgb,var(--danger) 40%,transparent);font-weight:500}
.btn.w{width:100%}
.btns{display:flex;gap:8px;margin-top:10px}.btns>*{flex:1}
.chip{flex:none;border:var(--cardB);background:var(--card);color:var(--ink);border-radius:999px;padding:8px 13px;font:inherit;font-size:13px;white-space:nowrap;cursor:pointer;min-height:36px}
.chip.on{background:var(--btn);color:var(--btnInk);border-color:transparent}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;margin-bottom:8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:var(--cardB);box-shadow:var(--sh);border-radius:16px;padding:0 14px;margin-bottom:10px}
.search svg{width:18px;height:18px;color:var(--mu);flex:none}
.search input{flex:1;background:transparent;border:0;color:var(--ink);font:inherit;font-size:16px;padding:12px 0;outline:none}
.search input::placeholder{color:var(--mu)}
.search select{background:transparent;border:0;color:var(--mu);font:inherit;font-size:13px;outline:none;max-width:44%}
.search select option{color:#111}
.it{display:flex;align-items:center;gap:11px;background:var(--rowBg,var(--card));border:var(--cardB);box-shadow:var(--rowSh,var(--sh));border-radius:18px;padding:9px 12px;margin-bottom:8px;min-height:60px}
.it .nm{flex:1;min-width:0}
.it .nm a,.it .nm span.u{color:var(--ink);text-decoration:none;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.av{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;flex:none;text-transform:uppercase}
.ck{width:24px;height:24px;border-radius:50%;border:1.5px solid var(--mu);flex:none;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;padding:0;color:var(--btnInk)}
.ck.on{background:var(--btn);border-color:transparent}
.ck svg{width:14px;height:14px}
.star{border:0;background:transparent;color:var(--mu);cursor:pointer;width:40px;height:40px;display:flex;align-items:center;justify-content:center;flex:none;opacity:.7}
.star.on{color:#f2b52e;opacity:1}
.star svg{width:20px;height:20px}
.star.on svg{fill:currentColor}
.nav{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 24px));display:flex;align-items:center;justify-content:space-around;background:var(--card);border:var(--cardB);box-shadow:var(--sh),0 10px 30px rgba(0,0,0,.08);border-radius:26px;padding:7px 6px;z-index:10;overflow:visible}
.nav button,.nav label{border:0;background:transparent;color:var(--mu);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;min-width:56px;padding:4px 0;position:relative}
.nav svg{width:22px;height:22px}
.nav .on{color:var(--navOn)}
.nav .fab{width:54px;height:54px;border-radius:50%;background:var(--btn);color:var(--btnInk);justify-content:center;margin-top:-30px;box-shadow:0 8px 18px rgba(0,0,0,.2);min-width:0}
.nav .fab svg{width:26px;height:26px}
.nav .fab input,.drop input,.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%}
.selbar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));width:min(488px,calc(100% - 24px));display:flex;align-items:center;gap:10px;background:var(--hero);color:var(--onH);border:var(--heroB);box-shadow:var(--heroSh);border-radius:22px;padding:8px 8px 8px 12px;z-index:11;overflow:hidden}
.selbar .n{width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.28);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px}
.selbar .btn{background:var(--onH);color:var(--heroGo,var(--icC));min-height:40px;padding:8px 14px}
.selbar .lk{border:0;background:transparent;color:inherit;font:inherit;font-size:13px;opacity:.85;cursor:pointer;padding:6px}
.drop{position:relative;display:flex;align-items:center;gap:14px;cursor:pointer}
.empty{text-align:center;padding:30px 16px;color:var(--mu)}
.big{font-size:32px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.qcard{text-align:center;padding:22px 16px}
.qcard .av{width:76px;height:76px;font-size:30px;margin:0 auto}
.qcard .u{font-size:19px;font-weight:600;margin-top:10px;word-break:break-all}
.tg{width:48px;height:28px;border-radius:14px;background:var(--soft);border:0;position:relative;cursor:pointer;flex:none;padding:0}
.tg::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:left .2s}
.tg.on{background:var(--btn)}
.tg.on::after{left:23px;background:var(--btnInk)}
.hbars .hb{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:14px}
.hbars .hb span:first-child{width:38%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbars .hb .tr{flex:1;height:8px;background:var(--soft);border-radius:4px;overflow:hidden}
.hbars .hb .tr i{display:block;height:100%;background:var(--icC);border-radius:4px}
.hbars .hb b{font-weight:500;color:var(--mu);font-size:13px;min-width:34px;text-align:right;font-variant-numeric:tabular-nums}
.months{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:10px}
.months div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%}
.months i{display:block;width:100%;background:var(--soft);border-radius:4px;min-height:3px}
.months i.mx{background:var(--icC)}
.months span{font-size:10px;color:var(--mu)}
.heat{display:grid;grid-template-columns:28px repeat(24,minmax(0,1fr));gap:2px;margin-top:8px;font-size:10px;color:var(--mu)}
.heat i{display:block;aspect-ratio:1;border-radius:2px;background:var(--icC)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{background:var(--soft);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:13px}
.step{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.step:first-child{border:0}
.step .n{width:28px;height:28px;border-radius:50%;background:var(--soft);color:var(--icC);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;flex:none}
.step b{font-weight:600}
.step ul{margin:6px 0 0;padding-left:18px;font-size:14px}
details summary{cursor:pointer;color:var(--icC);font-size:14px;padding:6px 0;list-style:none;font-weight:500}
details summary::-webkit-details-marker{display:none}
.swipe{position:relative;height:360px;margin:6px 0 16px;touch-action:pan-y}
.sc{position:absolute;inset:0;border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;user-select:none;touch-action:none;cursor:grab;margin:0}
.sc.back{transform:scale(.95) translateY(12px);opacity:.6}
.sc .av{width:96px;height:96px;font-size:38px}
.sc .u{font-size:20px;font-weight:600;word-break:break-all}
.sc .lbl{position:absolute;top:18px;padding:5px 12px;border-radius:10px;font-weight:700;font-size:14px;opacity:0}
.sc .lbl.l{left:18px;color:var(--danger);border:2px solid var(--danger)}
.sc .lbl.r{right:18px;color:#f2b52e;border:2px solid #f2b52e}
.rbtn{width:64px;height:64px;border-radius:50%;border:var(--cardB);background:var(--card);box-shadow:var(--sh);display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;overflow:hidden}
.rbtn svg{width:26px;height:26px}
.rbtn.x{color:var(--danger)}.rbtn.k{color:#f2b52e}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:30;padding:16px}
.modal .box{max-width:488px;width:100%;padding:20px;border-radius:24px;background:var(--solidCard,#fff);color:var(--solidInk,#1d1b2e);margin-bottom:env(safe-area-inset-bottom)}
.modal .box .btn.sec2{background:transparent;color:inherit;border:1px solid rgba(128,128,128,.35)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(30,30,36,.94);color:#fff;padding:10px 16px;border-radius:14px;font-size:14px;z-index:40;max-width:90vw;text-align:center;text-shadow:none}
.spin{width:28px;height:28px;border:3px solid var(--soft);border-top-color:var(--icC);border-radius:50%;animation:sp 1s linear infinite;margin:0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
.skins{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:12px 8px;margin-top:8px}
.skin{border:0;background:transparent;color:var(--ink);font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;padding:0}
.skin .sw{width:46px;height:46px;border-radius:50%;position:relative;overflow:hidden;box-shadow:0 2px 6px rgba(0,0,0,.15),inset 0 0 0 1px rgba(255,255,255,.35)}
.skin.on .sw{outline:2.5px solid var(--ink);outline-offset:3px}
.grp{font-size:12px;color:var(--mu);margin:14px 0 2px;font-weight:500}
.seg{display:inline-flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-size:13px;padding:6px 14px;border-radius:9px;cursor:pointer}
.seg button.on{background:var(--btn);color:var(--btnInk)}
.filebtn{position:relative;overflow:hidden}
.note{background:var(--soft);color:var(--ink);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.45}
.qa{background:var(--rowBg,var(--card));border:var(--cardB);box-shadow:var(--rowSh,var(--sh));border-radius:16px;margin-bottom:8px;overflow:hidden}
.qa summary{display:flex;align-items:center;gap:10px;padding:13px 14px;cursor:pointer;list-style:none;font-weight:600;color:var(--ink);font-size:15px}
.qa summary span:first-child{flex:1}
.qa summary .chev{transition:transform .2s}
.qa[open] summary .chev{transform:rotate(180deg)}
.qa p{margin:0;padding:0 14px 14px;color:var(--ink);opacity:.85;font-size:14px;line-height:1.55}
.pchip{display:inline-flex;align-items:center;gap:8px;background:var(--card);border:var(--cardB);box-shadow:var(--sh);border-radius:999px;padding:4px 12px 4px 4px;font:inherit;font-size:14px;font-weight:500;color:var(--ink);cursor:pointer;margin:-4px 0 14px;position:relative;overflow:hidden}
.pchip .av{width:30px;height:30px;font-size:12px}
.profrow{display:flex;align-items:center;gap:12px;width:100%;border:0;background:transparent;color:inherit;font:inherit;padding:10px 8px;border-radius:14px;cursor:pointer}
.profrow.on{background:rgba(128,128,128,.12)}
.field{width:100%;border:1.5px solid var(--icC);border-radius:14px;padding:12px 14px;font:inherit;font-size:16px;background:var(--solidCard,#fff);color:var(--solidInk,#1d1b2e);outline:none}
input[type=range]{width:100%;accent-color:var(--icC)}
a{color:var(--icC)}
:focus-visible{outline:2px solid var(--icC);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}.spin{animation-duration:3s}}
</style>
</head>
<body>
<div id="fx"></div>
<div id="app"><div class="empty"><div class="spin"></div></div></div>

const HELP = {
en: [
 { id:'start', icon:'book', tone:'t4', title:'Getting started', sub:'Get your ZIP from Instagram', qs:[
  ['Why do I need a ZIP file?', 'Instagram doesn’t let other apps peek at your followers. But it does let you download your own data. You grab that ZIP, the app reads it, and you never type your password anywhere. Win-win.'],
  ['How long does Instagram take?', 'Usually a few minutes, sometimes a few hours. You’ll get an email when it’s ready. Go make a coffee.'],
  ['Which options should I pick?', 'Date range: All time. Format: JSON. Media quality: Low. And only the categories in the steps above. Pick everything and you get a 9 GB monster with all your photos, which the app doesn’t even need.']
 ]},
 { id:'lists', icon:'list', tone:'t1', title:'Lists and ★ Kept', sub:'Who’s who, filters, the star', qs:[
  ['Not following back, Fans, Mutual?', 'Not following back: you follow them, they don’t follow you. Fans: they follow you, you don’t follow them. Mutual: you follow each other. Nice and healthy.'],
  ['What does the ★ do?', 'It means “I’m keeping this one”. Your favourite singer won’t follow you back and that’s fine. Starred accounts hide from the list and live under the “Kept” filter, even after a new ZIP. Tap the star again to bring them back. It does nothing on Instagram.'],
  ['What is Quick sort?', 'A faster way to go through your list, one account at a time. Swipe left (or tap “To queue”) to add them to your unfollow queue, swipe right (or tap “★ Keep”) to keep them. Nobody gets unfollowed here. The real unfollow happens later in the queue, inside Instagram.'],
  ['What are the filters (2+ years, Last month…)?', 'They show accounts by when you followed them. “2+ years” is great for spring cleaning old follows.'],
  ['Why no profile photos or follower counts?', 'They’re not in Instagram’s ZIP, only usernames and dates. Getting them would mean scraping Instagram, which is exactly what we avoid. Tap a name to open the profile if you need to see who it is.'],
  ['I unfollowed someone but they’re still in the list', 'If you tapped Done in the queue, they’re hidden right away. If you unfollowed straight from Instagram, they’ll disappear with your next ZIP.'],
  ['Pending requests, Close friends, Blocked?', 'Pending: requests you sent to private accounts that never accepted, and you can cancel them through the queue. Close friends check: people in your close friends who don’t follow you. Blocked, restricted, hidden: everyone you’ve blocked, restricted or hidden your story from, in one place.']
 ]},
 { id:'queue', icon:'clock', tone:'t3', title:'Unfollow queue', sub:'Safe pace, limits, pauses', qs:[
  ['Does the app unfollow for me?', 'Nope, and that’s on purpose. The app opens the profile, you tap Unfollow in Instagram, then come back and tap Done. To Instagram you look like a normal human, not a robot with a grudge.'],
  ['Why wait between unfollows?', 'Unfollowing 200 people in 5 minutes is very “I’m a bot”. Random pauses and breaks keep your account safe. You can turn the wait off in Settings, but the daily limit stays.'],
  ['What’s a safe daily limit?', 'Instagram doesn’t publish its limits. A few dozen a day, spread over the day, is the safe zone. The app starts at 80, and you can lower or raise it in Settings. 1,000 accounts take about two weeks. Slow and steady.'],
  ['Instagram said “Try again later”', 'That’s Instagram tapping you on the shoulder. Tap the red “Try again later” button in the queue: the plan pauses for 48 hours and then continues at a slower pace. Don’t fight it.'],
  ['Done vs Gone vs Skip vs Keep', 'Done: you unfollowed them. Gone / renamed: the profile says “page isn’t available”, so it’s deleted or changed username, and it doesn’t count towards your daily limit. Skip: move it to the end of the queue. Keep: changed your mind, they get a ★.'],
  ['Can I close the app mid-queue?', 'Yes. The queue, your progress and the countdown are saved. Come back whenever.']
 ]},
 { id:'history', icon:'hist', tone:'t2', title:'History', sub:'Who unfollowed you', qs:[
  ['How does it know who unfollowed me?', 'It compares your ZIPs. Anyone who was in your followers last time and isn’t now unfollowed you (or deleted their account). So you need at least two uploads.'],
  ['How often should I upload?', 'Every week or two works great. Same options every time.'],
  ['Can I delete an upload?', 'Yes, tap Delete on it in History. Your lists stay as they are.']
 ]},
 { id:'wrapped', icon:'spark', tone:'t4', title:'Wrapped and Security', sub:'Your stats and logins', qs:[
  ['Wrapped is empty', 'Include “Likes”, “Comments” and “Messages” in your export. No data, no fun stats.'],
  ['Why do Top DMs show names, not usernames?', 'Instagram’s messages file only has display names. Blame Instagram.'],
  ['What does “Rare” mean in Security?', 'A device that logged in only once or twice in the last 90 days. Maybe it’s your friend’s phone, maybe it isn’t. If you don’t recognise it, change your password and turn on two-factor login.'],
  ['What’s the advertisers list?', 'Companies that uploaded a list with your info (like your email) to show you ads. It’s Instagram’s own data about you, not ours.']
 ]},
 { id:'profiles', icon:'users', tone:'t1', title:'Profiles and name', sub:'More than one account', qs:[
  ['How do I add another account?', 'Upload that account’s ZIP. The app reads the username and asks “Add as new profile?”. If the ZIP has no username (no “Personal information”), it asks which profile it belongs to.'],
  ['Are profiles separate?', 'Yes: each has its own lists, history, ★ Kept, queue and daily limit. Your name, theme and language are shared.'],
  ['How do I switch?', 'Tap the @username chip under the greeting on Home.'],
  ['What does Home show, name or @username?', 'You choose in Settings → Your name: your name, the @username of the current profile, or nothing.'],
  ['How do I delete a profile?', 'Settings → Your profiles → the bin icon. It only deletes it from this phone.']
 ]},
 { id:'themes', icon:'palette', tone:'t4', title:'Themes and settings', sub:'Skins, moving background', qs:[
  ['How do I change the look?', 'Settings → Theme. 23 skins: Classic, Nude, Fresh, Dark, Glass and Fluid.'],
  ['The background is moving!', 'That’s the Fluid skins. Turn it off in Settings → Moving background. It also stops if your phone has “reduce motion” turned on.'],
  ['English or Greek?', 'Settings → Language. The whole app switches, help included.']
 ]},
 { id:'backup', icon:'download', tone:'t3', title:'Backup and new phone', sub:'Export, import', qs:[
  ['What’s in the backup?', 'Everything: all profiles, history, ★ Kept, queue, progress and settings, in one file.'],
  ['How do I move to a new phone?', 'Old phone: Settings → Backup → Export. Send the file to yourself. New phone: install the app, Settings → Backup → Import, pick the file. Carry on where you left off.'],
  ['Where’s my data stored?', 'Only inside this browser on this phone. If you clear the browser’s data or cache, it’s gone. So export a backup now and then.']
 ]},
 { id:'trouble', icon:'warn', tone:'t2', title:'Troubleshooting', sub:'Stuck reading? 4 ZIPs?', qs:[
  ['It’s stuck on “Reading your file”', 'Big ZIP plus a slower phone means it needs a few minutes. Keep the screen on, stay in the app, plug in the charger and wait 5 to 10 minutes. If you leave the app, the phone may pause it and you start over. Next time request a smaller export (see Getting started) and it takes seconds.'],
  ['Instagram gave me 4 ZIPs', 'That happens when you include photos and videos. Try only the first ZIP, the followers are usually there. Or tap + and select all of them together. Best fix: request a new export with only the categories in Getting started.'],
  ['“This ZIP is in HTML format”', 'You picked HTML instead of JSON. Request it again with Format: JSON.'],
  ['“No Instagram data found”', 'Wrong file, or the followers are in another part of a split ZIP. Try the other ZIPs.'],
  ['The lists look wrong / a warning says “Last year”', 'Your export’s date range was “Last year”, so older followers are missing. Request it again with “All time”.'],
  ['I don’t see the new version', 'Close the app completely and open it again. Give it a couple of minutes after an update.'],
  ['I tapped something and nobody got unfollowed', 'Correct. The app never unfollows by itself. Unfollows happen only when you tap Unfollow inside Instagram.']
 ]},
 { id:'install', icon:'phone', tone:'t1', title:'Install on your phone', sub:'Make it a real app icon', qs:[
  ['Which browser?', 'Chrome on Android, Safari on iPhone. Other browsers (like the phone maker’s own) may be slow or not install it.'],
  ['I opened it in another browser and my data is gone', 'Each browser keeps its own data. Go back to the one you used, or move it with Backup → Export / Import.']
 ]},
 { id:'privacy', icon:'lock', tone:'t4', title:'Privacy', sub:'What leaves your phone', qs:[
  ['Does my data leave my phone?', 'No. Your ZIP is read inside the app on your phone. Nothing is uploaded, not even to the person who made the app.'],
  ['Do I give my password?', 'Never. If any app asks for your Instagram password to “find unfollowers”, run.'],
  ['How do I delete everything?', 'Settings → Delete all data. Gone from this phone.']
 ]}
],
el: [
 { id:'start', icon:'book', tone:'t4', title:'Ξεκίνημα', sub:'Πώς παίρνεις το ZIP από το Instagram', qs:[
  ['Γιατί χρειάζομαι αρχείο ZIP;', 'Το Instagram δεν αφήνει άλλες εφαρμογές να κοιτάνε τους followers σου. Σε αφήνει όμως να κατεβάσεις τα δικά σου δεδομένα. Παίρνεις το ZIP, η εφαρμογή το διαβάζει και δεν βάζεις ποτέ κωδικό πουθενά. Όλοι κερδισμένοι.'],
  ['Πόσο αργεί το Instagram;', 'Συνήθως λίγα λεπτά, μερικές φορές λίγες ώρες. Θα σου έρθει email όταν είναι έτοιμο. Πήγαινε φτιάξε έναν καφέ.'],
  ['Ποιες επιλογές διαλέγω;', 'Date range: All time. Format: JSON. Media quality: Low. Και μόνο τις κατηγορίες των βημάτων από πάνω. Αν τα διαλέξεις όλα, θα πάρεις ένα τέρας 9 GB με όλες τις φωτογραφίες σου, που η εφαρμογή δεν τις χρειάζεται καν.']

 { id:'lists', icon:'list', tone:'t1', title:'Λίστες και ★ Κρατάω', sub:'Ποιος είναι ποιος, φίλτρα, το αστέρι', qs:[
  ['Δεν σε ακολουθούν πίσω, Fans, Αμοιβαίοι;', 'Δεν σε ακολουθούν πίσω: τους ακολουθείς, δεν σε ακολουθούν. Fans: σε ακολουθούν, δεν τους ακολουθείς. Αμοιβαίοι: ακολουθείτε ο ένας τον άλλον. Υγιέστατο.'],
  ['Τι κάνει το ★;', 'Σημαίνει «αυτόν τον κρατάω». Η αγαπημένη σου τραγουδίστρια δεν θα σε ακολουθήσει πίσω, και είναι οκ. Όσοι έχουν αστέρι κρύβονται από τη λίστα και μένουν στο φίλτρο «Κρατάω», ακόμα και με νέο ZIP. Ξαναπατάς το αστέρι για να γυρίσουν. Δεν κάνει τίποτα στο Instagram.'],
  ['Τι είναι η Γρήγορη διαλογή;', 'Ένας πιο γρήγορος τρόπος να περάσεις τη λίστα σου, έναν-έναν. Σύρε αριστερά (ή πάτα «Στην ουρά») για να μπει στην ουρά unfollow, σύρε δεξιά (ή πάτα «★ Κρατάω») για να τον κρατήσεις. Εδώ δεν γίνεται κανένα unfollow. Το πραγματικό unfollow γίνεται αργότερα στην ουρά, μέσα στο Instagram.'],
  ['Τι είναι τα φίλτρα (2+ χρόνια, Τελευταίος μήνας…);', 'Δείχνουν λογαριασμούς ανάλογα με το πότε τους ακολούθησες. Το «2+ χρόνια» είναι ιδανικό για γενική καθαριότητα.'],
  ['Γιατί δεν έχει φωτογραφίες προφίλ ή αριθμό followers;', 'Δεν υπάρχουν στο ZIP του Instagram, μόνο usernames και ημερομηνίες. Για να τα πάρουμε θα έπρεπε να «ξύνουμε» το Instagram, και αυτό ακριβώς αποφεύγουμε. Πάτα ένα όνομα για να ανοίξει το προφίλ.'],
  ['Έκανα unfollow αλλά είναι ακόμα στη λίστα', 'Αν πάτησες «Έγινε» στην ουρά, κρύβεται αμέσως. Αν έκανες unfollow κατευθείαν από το Instagram, θα φύγει με το επόμενο ZIP.'],
  ['Αιτήματα, Close friends, Μπλοκαρισμένοι;', 'Αιτήματα: όσα έστειλες σε ιδιωτικούς λογαριασμούς και δεν εγκρίθηκαν ποτέ. Τα ακυρώνεις μέσα από την ουρά. Έλεγχος close friends: όσοι είναι στα close friends σου αλλά δεν σε ακολουθούν. Μπλοκαρισμένοι, περιορισμένοι, κρυφά: όλοι όσοι έχεις μπλοκάρει, περιορίσει ή τους κρύβεις τη story σου, σε ένα σημείο.']
 ]},
 { id:'queue', icon:'clock', tone:'t3', title:'Ουρά unfollow', sub:'Ασφαλής ρυθμός, όρια, παύσεις', qs:[
  ['Κάνει η εφαρμογή το unfollow για μένα;', 'Όχι, και επίτηδες. Η εφαρμογή ανοίγει το προφίλ, εσύ πατάς Unfollow στο Instagram, γυρνάς και πατάς «Έγινε». Για το Instagram είσαι ένας κανονικός άνθρωπος, όχι ένα ρομπότ με κακία.'],
  ['Γιατί υπάρχει αναμονή ανάμεσα στα unfollow;', 'Το να κάνεις unfollow 200 άτομα σε 5 λεπτά φωνάζει «είμαι bot». Οι τυχαίες παύσεις και τα διαλείμματα κρατάνε τον λογαριασμό σου ασφαλή. Μπορείς να κλείσεις την αναμονή στις Ρυθμίσεις, αλλά το όριο ημέρας μένει.'],
  ['Ποιο είναι ένα ασφαλές όριο ημέρας;', 'Το Instagram δεν δημοσιεύει όρια. Λίγες δεκάδες τη μέρα, μοιρασμένες στη μέρα, είναι η ασφαλής ζώνη. Η εφαρμογή ξεκινάει από 80 και το αλλάζεις στις Ρυθμίσεις. Τα 1.000 θέλουν περίπου δύο εβδομάδες. Σιγά σιγά και σταθερά.'],
  ['Το Instagram μου είπε «Try again later»', 'Είναι το Instagram που σου χτυπάει τον ώμο. Πάτα το κόκκινο κουμπί «Try again later» στην ουρά: το πλάνο σταματάει για 48 ώρες και μετά συνεχίζει πιο αργά. Μην το πεισμώνεις.'],
  ['Έγινε, Δεν υπάρχει, Παράλειψη, Κρατάω;', 'Έγινε: τον έκανες unfollow. Δεν υπάρχει / άλλαξε όνομα: το προφίλ γράφει «page isn’t available», άρα σβήστηκε ή άλλαξε username, και δεν μετράει στο όριο ημέρας. Παράλειψη: πάει στο τέλος της ουράς. Κρατάω: άλλαξες γνώμη, παίρνει ★.'],
  ['Μπορώ να κλείσω την εφαρμογή στη μέση;', 'Ναι. Η ουρά, η πρόοδος και η αντίστροφη μέτρηση αποθηκεύονται. Γύρνα όποτε θες.']

    async clear() { for (const k in mem) delete mem[k]; try { const db = await open(); await new Promise(res => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').clear(); tx.oncomplete = res; tx.onerror = res; }); } catch (e) { } }

let Dv = null;
function derive() {
  if (!D) { Dv = null; return; }
  const lc = a => new Set(a.map(x => x.u.toLowerCase()));
  const fo = lc(D.followers), fg = lc(D.following);
  const hid = u => PR.done[u.toLowerCase()] || PR.gone[u.toLowerCase()];
  Dv = {
    notBack: D.following.filter(x => !fo.has(x.u.toLowerCase()) && !hid(x.u)),
    fans: D.followers.filter(x => !fg.has(x.u.toLowerCase())),
    mutual: D.following.filter(x => fo.has(x.u.toLowerCase())),
    pending: D.pending.filter(x => !hid(x.u)),
    closeNB: D.close.filter(x => !fo.has(x.u.toLowerCase())),
  };
  Dv.keptList = Dv.notBack.filter(x => PR.kept[x.u.toLowerCase()]);
  Dv.nbActive = Dv.notBack.filter(x => !PR.kept[x.u.toLowerCase()]);
}

/* backup */
async function doExport() {
  const data = { app: 'unfollowers', v: 3, at: Date.now(), ST, profiles: {} };
  for (const id in ST.profiles) data.profiles[id] = { D: id === ST.active ? D : (await DB.get(dKey(id))) || null, SN: id === ST.active ? SN : (await DB.get(sKey(id))) || [] };
  const name = 'unfollowers-backup-' + new Date().toISOString().slice(0, 10) + '.json';
  const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
  let ok = false;
  try {
    const f = new File([blob], name, { type: 'application/json' });
    if (/iPhone|iPad|iPod/.test(navigator.userAgent) && navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: 'Unfollowers backup' }); ok = true; }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  if (!ok) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000); }
  ST.lastBackup = Date.now(); await saveST(); render(); toast(t('exported'));
}
function migrate(st, D0, SN0) {

  const o = defST(); if (st) { for (const k of ['lang', 'theme', 'motion', 'lastBackup']) if (st[k] != null) o[k] = st[k]; }
  const me = D0 && D0.me ? D0.me : ''; const id = me ? me.toLowerCase() : 'main';
  const p = fixProf(Object.assign(newProf(id, me), st ? { kept: st.kept, done: st.done, gone: st.gone, plan: st.plan } : {}));
  if (D0) { p.date = D0.date || 0; }

}

  if (!file) return;
  let x = null; try { x = JSON.parse(await file.text()); } catch (e) { }
  if (!x || x.app !== 'unfollowers' || !x.ST) { toast(t('importErr')); return; }
  ask(t('importSure', { d: fmtDT(x.at || Date.now()) }), t('importB'), async () => {
    await DB.clear();
    let st, items = [];
    if (x.profiles) { st = migrate(x.ST).st; for (const id in x.profiles) items.push([id, x.profiles[id].D, x.profiles[id].SN]); }
    else { const m = migrate(x.ST, x.D, x.SN); st = m.st; items = m.moves; }
    ST = st; for (const [id, d, sn] of items) { await DB.set(dKey(id), d || null); await DB.set(sKey(id), sn || []); }
    lang = ST.lang || lang; await saveST(); await loadActive();
    derive(); applySkin(); go('home'); toast(t('importedB'));
  });
}

/* import ZIP */
async function importFiles(fl) {
  if (!fl || !fl.length) return;
  V = { name: 'home' }; busy = [...fl].map(f => f.name).join(', '); render(); window.scrollTo(0, 0);
  try {
    const all = []; let date = 0;
    for (const f of fl) {
      const r = new zip.ZipReader(new zip.BlobReader(f), { useWebWorkers: false });
      const ents = await r.getEntries();
      for (const e of ents) { if (e.directory) continue; if (e.lastModDate && e.lastModDate.getTime() > date) date = e.lastModDate.getTime(); all.push({ name: e.filename, text: () => e.getData(new zip.TextWriter()) }); }
    }
    const R = await IGParser.parse(all, (d, n) => { busy = d + ' / ' + n; const m = document.getElementById('busy'); if (m) m.textContent = busy; });
    if (!R.has.followers && !R.has.following) throw new Error('NO_DATA');
    if (!date || date > Date.now() + 864e5) date = Date.now();
    busy = null;
    let target = null; const ids = Object.keys(ST.profiles);
    const isEmpty = id => { const p = ST.profiles[id]; return !p.date && !p.me; };
    if (R.me) {
      const id = R.me.toLowerCase();
      if (ST.profiles[id]) target = id;
      else if (ids.length === 1 && isEmpty(ids[0])) { const old = ST.profiles[ids[0]]; delete ST.profiles[ids[0]]; old.id = id; old.me = R.me; ST.profiles[id] = old; target = id; }
      else { render(); const ok = await choose(t('newAcc'), t('newAccSub', { u: '<b>@' + esc(R.me) + '</b>' }), [{ label: t('addAsNew'), v: 1, pri: 1 }, { label: t('cancel'), v: 0 }]); if (!ok) { render(); return; } ST.profiles[id] = newProf(id, R.me); target = id; }
    } else {
      if (ids.length === 1) target = ids[0];
      else { render(); target = await choose(t('whichProfile'), '', profList().map(p => ({ label: profLabel(p), v: p.id })).concat([{ label: t('newProfileOpt'), v: '__new' }, { label: t('cancel'), v: null }])); if (!target) { render(); return; } if (target === '__new') { target = 'p' + Date.now(); ST.profiles[target] = newProf(target, ''); } }
    }
    ST.active = target; await saveST(); await loadActive();
    R.date = date; D = R; PR.date = date; if (R.me) PR.me = R.me;
    const fgset = new Set(R.following.map(x => x.u.toLowerCase()).concat(R.pending.map(x => x.u.toLowerCase())));
    for (const k in PR.done) { if (!fgset.has(k) || date > PR.done[k] + 3600e3) delete PR.done[k]; }
    for (const k in PR.gone) { if (!fgset.has(k)) delete PR.gone[k]; }
    const snap = { d: date, fo: R.followers.map(x => x.u.toLowerCase()), fg: R.following.map(x => x.u.toLowerCase()) };
    SN = SN.filter(s => dayKey(new Date(s.d)) !== dayKey(new Date(date))); SN.push(snap); SN.sort((a, b) => b.d - a.d); SN = SN.slice(0, 40);
    derive(); PR.nb = Dv.nbActive.length;
    await DB.set(dKey(ST.active), D); await DB.set(sKey(ST.active), SN); await saveST();
    busy = null; render(); toast(t('imported') + ' · ' + fmtN(R.followers.length) + ' ' + t('followersN'));
  } catch (e) {
    busy = null; render();
    toast(e.message === 'HTML_FORMAT' ? t('errHtml') : e.message === 'NO_DATA' ? t('errNone') : t('errRead'));
    console.error(e);
  }
}

/* events */
document.addEventListener('click', e => {
  const a = e.target.closest('[data-act]'); if (!a || a.closest('#layer')) return;
  const act = a.dataset.act;
  if (act === 'nav') { const to = a.dataset.to; if (to === 'list' && !a.dataset.arg) { go('list', V.name === 'swipe' ? 'notBack' : (V.arg || 'notBack')); return; } go(to, a.dataset.arg); if (a.dataset.arg && a.dataset.arg.startsWith('fmk:')) { LS.tab = +a.dataset.arg.split(':')[1]; render(); } }
  else if (act === 'lang') { lang = a.dataset.l; ST.lang = lang; saveST(); render(); }
  else if (act === 'skin') { ST.theme = a.dataset.id; saveST(); applySkin(); render(); }
  else if (act === 'motiontg') { ST.motion = !ST.motion; saveST(); applySkin(); render(); }
  else if (act === 'waittg') { PR.plan.wait = !PR.plan.wait; if (!PR.plan.wait) { PR.plan.nextAt = 0; PR.plan.breakUntil = 0; } saveST(); render(); }
  else if (act === 'pace') { const m = { calm: [180, 360], normal: [120, 240], fast: [60, 120] }[a.dataset.p]; PR.plan.min = m[0]; PR.plan.max = m[1]; saveST(); render(); }
  else if (act === 'clearq') ask(t('clearQSure'), t('clearQ'), () => { const P = PR.plan; P.items = []; P.total = 0; P.nextAt = 0; saveST(); derive(); render(); });
  else if (act === 'export') doExport();
  else if (act === 'tab') { LS.tab = +a.dataset.i; LS.sel = new Set(); shown = LIMIT; render(); }
  else if (act === 'filter') { LS.filter = a.dataset.f; LS.sel = new Set(); shown = LIMIT; render(); }
  else if (act === 'more') { shown += LIMIT; render(); }
  else if (act === 'sel') { const k = a.dataset.u.toLowerCase(); LS.sel.has(k) ? LS.sel.delete(k) : LS.sel.add(k); const y = scrollY; render(); scrollTo(0, y); }
  else if (act === 'selall') { const y = scrollY; if (LS.sel.size) LS.sel = new Set(); else LS.sel = new Set(filtered(listDef(V.arg)).map(x => x.u.toLowerCase())); render(); scrollTo(0, y); }
  else if (act === 'selclear') { const y = scrollY; LS.sel = new Set(); render(); scrollTo(0, y); }
  else if (act === 'keep') { const k = a.dataset.u.toLowerCase(); if (PR.kept[k]) delete PR.kept[k]; else PR.kept[k] = 1; LS.sel.delete(k); saveST(); derive(); const y = scrollY; render(); scrollTo(0, y); }
  else if (act === 'addq') { if (!LS.sel.size) return; const def = listDef(V.arg); const list = def.items.filter(x => LS.sel.has(x.u.toLowerCase())).map(x => ({ u: x.u, kind: a.dataset.kind })); const n = addToPlan(list); saveST(); LS.sel = new Set(); toast(t('addedQ') + ' · ' + n); render(); }
  else if (act === 'swl') swDo('l');
  else if (act === 'swr') swDo('r');
  else if (act === 'swundo') swUndo();
  else if (act === 'qdone') qAdvance(true);
  else if (act === 'qgone') { const it = PR.plan.items[0]; PR.gone[it.u.toLowerCase()] = Date.now(); qAdvance(false); }
  else if (act === 'qskip') { const P = PR.plan; P.items.push(P.items.shift()); saveST(); render(); }
  else if (act === 'qkeep') { const it = PR.plan.items[0]; PR.kept[it.u.toLowerCase()] = 1; PR.plan.total = Math.max(0, PR.plan.total - 1); PR.plan.items.shift(); if (!PR.plan.items.length) PR.plan.total = 0; saveST(); derive(); render(); }
  else if (act === 'pause48') { const P = PR.plan; P.pausedUntil = Date.now() + 48 * 3600e3; P.daily = Math.max(20, Math.round(P.daily * .6 / 5) * 5); P.min = Math.max(P.min, 180); P.max = Math.max(P.max, 360); P.wait = true; saveST(); render(); }
  else if (act === 'resume') ask(t('resumeWarn'), t('resume'), () => { PR.plan.pausedUntil = 0; saveST(); render(); });
  else if (act === 'year') { LS.year = a.dataset.y; render(); }
  else if (act === 'delsnap') { const i = +a.dataset.i; ask(t('delSure'), t('del'), async () => { SN.splice(i, 1); await DB.set(sKey(ST.active), SN); render(); }); }
  else if (act === 'wipe') ask(t('wipeSure'), t('wipe'), async () => { await DB.clear(); D = null; SN = []; const keep = { theme: ST.theme, lang, name: ST.name, motion: ST.motion }; ST = defST(); Object.assign(ST, keep); PR = ST.profiles.main; await saveST(); derive(); go('home'); });
  else if (act === 'profsheet') profSheet();
  else if (act === 'profswitch') switchProfile(a.dataset.id);
  else if (act === 'profdel') { const id = a.dataset.id; const p = ST.profiles[id]; ask(t('delProfileSure', { u: profLabel(p) }), t('del'), async () => { delete ST.profiles[id]; await DB.set(dKey(id), null); await DB.set(sKey(id), []); if (!Object.keys(ST.profiles).length) ST.profiles.main = newProf('main', ''); if (ST.active === id) ST.active = profList()[0].id; await saveST(); await loadActive(); derive(); render(); }); }
  else if (act === 'showwho') { ST.showWho = a.dataset.w; saveST(); render(); }
  else if (act === 'namedismiss') { ST.namePromptOff = true; saveST(); render(); }
  else if (act === 'nameask') { go('settings'); setTimeout(() => { const n = document.getElementById('namein'); if (n) n.focus(); }, 60); }
});
document.addEventListener('input', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'q') { LS.q = a.value; shown = LIMIT; const pos = a.selectionStart; render(); const n = document.querySelector('[data-act=q]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { } } }
  if (a.dataset.act === 'hq') { LS.hq = a.value; const pos = a.selectionStart; render(); const n = document.querySelector('[data-act=hq]'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (er) { } } }
  if (a.dataset.act === 'namein') { ST.name = a.value.slice(0, 30); if (ST.name.trim()) ST.namePromptOff = true; saveST(); }
  if (a.dataset.act === 'daily') { PR.plan.daily = +a.value; const v = document.getElementById('dlv'); if (v) v.textContent = a.value; saveST(); }
});
document.addEventListener('change', e => {
  const a = e.target.closest('[data-act]'); if (!a) return;
  if (a.dataset.act === 'sort') { LS.sort = a.value; render(); }
  if (a.dataset.act === 'file') { const f = [...(a.files || [])]; document.getElementById('layer').innerHTML = ''; importFiles(f); }
  if (a.dataset.act === 'import') doImport(a.files && a.files[0]);
});
document.addEventListener('visibilitychange', () => { if (!document.hidden && V.name === 'queue') render(); });

(async () => {
  try {
    const st = await DB.get('st');
    if (st && !st.profiles) { const D0 = (await DB.get('data')) || null, SN0 = (await DB.get('snaps')) || []; const m = migrate(st, D0, SN0); ST = m.st; for (const [id, d, sn] of m.moves) { await DB.set(dKey(id), d); await DB.set(sKey(id), sn); } await DB.set('data', null); await DB.set('snaps', null); await saveST(); }
    else if (st) ST = migrate(st).st;
    await loadActive();
  } catch (e) { storeOK = false; }
  lang = ST.lang || ((navigator.language || '').toLowerCase().startsWith('el') ? 'el' : 'en');
  applySkin(); derive(); render();
})();
}
